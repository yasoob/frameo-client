name: Build binaries

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build embedded UI
        working-directory: web
        run: npm run build
      - name: Check Go code
        run: go vet ./...
      - name: Test Go code with race detection
        run: go test -race ./...
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test browser UI with synthetic frame data
        working-directory: web
        run: npm test
      - name: Save frontend for cross-platform builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: internal/server/ui/
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            extension: ''
          - goos: darwin
            goarch: amd64
            extension: ''
          - goos: windows
            goarch: arm64
            extension: '.exe'
          - goos: windows
            goarch: amd64
            extension: '.exe'
          - goos: linux
            goarch: arm64
            extension: ''
          - goos: linux
            goarch: amd64
            extension: ''
    env:
      BINARY: frameo-local-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/server/ui
      - name: Build single executable
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/$BINARY" ./cmd/frameo
      - name: Generate checksum
        working-directory: dist
        run: sha256sum "$BINARY" > "$BINARY.sha256"
      - name: Upload platform binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameo-local-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
